
[serve.static]
plugins = [
  # moi's Tailwind plugin (bun-plugin-tailwind plus the :has() selector rewrite).
  # Keep in sync with scripts/build-client.ts.
  "./server/bundler/tailwind-plugin.ts",
  "./client/externalize-react.ts",
  "./client/accept-hmr-dependencies.ts"
]
# Inline only PUBLIC_*-prefixed env vars into the client bundle (e.g. the tldraw
# license key, PUBLIC_TLDRAW_LICENSE_KEY). The prefix keeps private secrets out
# of the browser bundle. Mirrored for prod builds in scripts/build-client.ts.
env = "PUBLIC_*"
