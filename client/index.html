<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app has no dark mode (nothing ever adds the `.dark` class), so say
         so: without this the browser picks a base canvas from the OS setting. -->
    <meta name="color-scheme" content="light" />
    <title>Moi</title>
    <!-- First-paint background, inline and before the stylesheet link on
         purpose. index.css is render-blocking, so until it resolves the browser
         has only its own white canvas to paint — on a cold load or a new tab
         that is a white flash the stylesheet cannot prevent, because it *is*
         the stylesheet. Parsed from the HTML, this applies with no round trip.
         The literal duplicates `--muted` in client/index.css (custom properties
         do not exist yet at this point); theme.test.ts pins the two together. -->
    <style>
      html {
        background: oklch(0.97 0 0);
      }
    </style>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <!-- React is vendored locally (client/vendor/react/<version>, generated by
         scripts/build-vendor.ts, which also rewrites these URLs) and served by
         the /vendor/react route, so moi runs fully offline — no CDN fetch. The
         server picks the development or production build per environment; the
         version in the path is what lets production cache them forever. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react/19.2.4/react.js",
          "react/jsx-runtime": "/vendor/react/19.2.4/react-jsx-runtime.js",
          "react/jsx-dev-runtime": "/vendor/react/19.2.4/react-jsx-dev-runtime.js",
          "react-dom": "/vendor/react/19.2.4/react-dom.js",
          "react-dom/client": "/vendor/react/19.2.4/react-dom-client.js"
        }
      }
    </script>
    <!-- Fetch React (the wrappers and the _impl files they import) as soon as
         the HTML is parsed, instead of two round trips later when the preload
         script below gets to run. Must stay after the importmap: a module
         fetch that starts before the map is parsed disables the map. -->
    <link rel="modulepreload" href="/vendor/react/19.2.4/react.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/_impl/react.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/react-jsx-runtime.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/_impl/react-jsx-runtime.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/react-jsx-dev-runtime.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/_impl/react-jsx-dev-runtime.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/react-dom.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/_impl/react-dom.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/react-dom-client.js" />
    <link rel="modulepreload" href="/vendor/react/19.2.4/_impl/react-dom-client.js" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script type="module">
      const [react, jsxRuntime, jsxDevRuntime, reactDom, reactDomClient] = await Promise.all([
        import('react'),
        import('react/jsx-runtime'),
        import('react/jsx-dev-runtime'),
        import('react-dom'),
        import('react-dom/client')
      ])
      globalThis.__esm = {
        react: react,
        'react/jsx-runtime': jsxRuntime,
        'react/jsx-dev-runtime': jsxDevRuntime,
        'react-dom': reactDom,
        'react-dom/client': reactDomClient
      }
      globalThis.__init(document.getElementById('root'))
      //# sourceURL=react-preload.js
    </script>
  </body>
</html>
