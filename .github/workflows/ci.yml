name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Validate registry
        run: bun run registry:validate

      - name: Check file naming and documentation links
        run: bun run check:repo

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # Avoid loading Linux keychain libraries into the Sharp test process.
        env:
          MOI_SECRET_BACKEND: file
        run: bun test

      - name: Pack and inspect package
        run: |
          bun pm pack --filename "$RUNNER_TEMP/moi-computer.tgz"
          tar -tzf "$RUNNER_TEMP/moi-computer.tgz" > "$RUNNER_TEMP/package-files.txt"
          grep -q '^package/dist/index.html$' "$RUNNER_TEMP/package-files.txt"
          if grep -Ei '\.env|secret' "$RUNNER_TEMP/package-files.txt"; then
            echo "::error::tarball contains sensitive files"
            exit 1
          fi

  windows-tests:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: >-
          bun test
          server/harness/auth.test.ts
          server/harness/claude-code/auth.test.ts
          server/harness/codex/auth.test.ts
