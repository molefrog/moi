name: Release

# Tag push starts the run. `verify` runs immediately; `publish` waits on the
# `release` environment's required reviewer, which is the single approval link.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.5.0)
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun test

      - name: Pack and inspect the tarball
        # prepack inlines the tldraw license key into the client bundle
        env:
          PUBLIC_TLDRAW_LICENSE_KEY: ${{ vars.PUBLIC_TLDRAW_LICENSE_KEY }}
        run: |
          rm -f moi-computer-*.tgz
          bun pm pack
          # Pin the exact name: a glob matching >1 tarball makes tar read the first as the
          # archive and the rest as members, and every check below fails against a good build.
          TGZ=$(ls moi-computer-*.tgz)
          [ "$(printf '%s\n' "$TGZ" | wc -l)" -eq 1 ] || { echo "::error::expected exactly one tarball, got: $TGZ"; exit 1; }
          tar -tzf "$TGZ" > files.txt
          grep -q '^package/dist/' files.txt || { echo "::error::tarball has no dist/"; exit 1; }
          if grep -Ei '\.env|secret' files.txt; then echo "::error::tarball contains secrets"; exit 1; fi

  standalone:
    name: Standalone (${{ matrix.platform }})
    needs: verify
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build standalone runtime
        env:
          PUBLIC_TLDRAW_LICENSE_KEY: ${{ vars.PUBLIC_TLDRAW_LICENSE_KEY }}
        run: |
          [ -n "$PUBLIC_TLDRAW_LICENSE_KEY" ] || { echo "::error::PUBLIC_TLDRAW_LICENSE_KEY variable is not set"; exit 1; }
          bun scripts/build-standalone.ts --outdir dist-standalone

      - uses: actions/upload-artifact@v4
        with:
          name: moi-standalone-${{ matrix.platform }}
          path: dist-standalone/moi-standalone-*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: standalone
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - name: Install webview dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: moi-standalone-${{ matrix.platform }}
          path: dist-standalone

      - name: Build desktop app
        run: |
          tarball=$(find dist-standalone -name "moi-standalone-*-${{ matrix.platform }}.tar.gz" -type f -print -quit)
          test -n "$tarball"
          bun scripts/build-desktop.ts --runtime "$tarball"

      - uses: actions/upload-artifact@v4
        with:
          name: moi-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    needs: [verify, standalone, desktop]
    if: >-
      ${{
        always() &&
        needs.verify.result == 'success' &&
        (
          contains(inputs.tag || github.ref_name, '-') ||
          (needs.standalone.result == 'success' && needs.desktop.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    # Gates the job on the `release` environment's reviewers, and is also the
    # environment claim npm's trusted publisher config matches against.
    environment: release
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Resolve tag and dist-tag
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$PKG" ] || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }
          case "$VERSION" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN: npm detects the OIDC environment and mints a
      # short-lived credential. Provenance is attached automatically.
      - name: Publish to npm
        # prepack inlines the tldraw license key into the client bundle; fail
        # rather than ship a build that nags about a missing license.
        env:
          PUBLIC_TLDRAW_LICENSE_KEY: ${{ vars.PUBLIC_TLDRAW_LICENSE_KEY }}
        run: |
          [ -n "$PUBLIC_TLDRAW_LICENSE_KEY" ] || { echo "::error::PUBLIC_TLDRAW_LICENSE_KEY variable is not set"; exit 1; }
          npm publish --tag ${{ steps.meta.outputs.dist_tag }}

  github-release:
    name: Publish GitHub release
    needs: [publish, standalone, desktop]
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: moi-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release payload
        run: |
          version=$(jq -r .version package.json)
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            asset="moi-standalone-$version-$platform.tar.gz"
            test -f "release-assets/$asset"
            test -f "release-assets/$asset.sha256"
            (cd release-assets && sha256sum -c "$asset.sha256")
          done
          test "$(find release-assets -type f -name '*.dmg' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.deb' | wc -l)" -ge 1

      - name: Stage draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/**/*

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
