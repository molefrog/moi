name: Release

# Verification builds the package; publishing waits for the release reviewer.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.5.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: npm-package-${{ github.run_attempt }}
      sha: ${{ steps.meta.outputs.sha }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Validate release tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(bun -p 'require("./package.json").version')
          [ "$RELEASE_TAG" = "v$VERSION" ] || { echo "::error::release tag does not match package.json"; exit 1; }
          case "$VERSION" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Validate registry
        run: bun run registry:validate

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # Match CI: headless tests use the file-backed secret store.
        env:
          MOI_SECRET_BACKEND: file
        run: bun test

      - name: Pack and inspect package
        # prepack inlines the public key. See docs/moi-scratchpad.md for key rotation.
        env:
          PUBLIC_TLDRAW_LICENSE_KEY: ${{ vars.PUBLIC_TLDRAW_LICENSE_KEY }}
        run: |
          [ -n "$PUBLIC_TLDRAW_LICENSE_KEY" ] || echo "::warning::Building without a tldraw license key; the Scratchpad will show a watermark"
          bun pm pack --filename "$RUNNER_TEMP/moi-computer.tgz"
          tar -tzf "$RUNNER_TEMP/moi-computer.tgz" > "$RUNNER_TEMP/package-files.txt"
          grep -q '^package/dist/index.html$' "$RUNNER_TEMP/package-files.txt"
          if grep -Ei '\.env|secret' "$RUNNER_TEMP/package-files.txt"; then
            echo "::error::tarball contains sensitive files"
            exit 1
          fi

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/moi-computer.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Retain the reviewer gate and npm's trusted-publisher environment claim.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up npm
        run: npm install -g npm@12.2.0

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/npm-package

      # Trusted publishing uses OIDC and attaches provenance automatically.
      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: npm publish "$RUNNER_TEMP/npm-package/moi-computer.tgz" --ignore-scripts --tag "$DIST_TAG"
